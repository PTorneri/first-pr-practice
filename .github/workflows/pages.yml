# Publica o site no GitHub Pages pela esteira do Actions.
#
# Por que este arquivo existe:
#
# Até 2026-08-06 o Pages usava o modo `legacy`, em que o próprio GitHub roda
# Jekyll sobre o repositório e publica o resultado. Naquele dia a esteira
# emperrou: oito builds seguidos falharam com "Page build failed", sem log e
# sem causa identificável, e o site ficou vinte horas servindo uma versão
# antiga — entre outras coisas, sem a frente de inglês de Medicina, que tem 150
# questões e nunca havia estado no ar. O `.nojekyll` na raiz destravou, mas a
# esteira antiga continuou sendo a esteira antiga.
#
# Aqui a publicação passa a ser um workflow comum: faz checkout, empacota o
# repositório como artefato estático e publica. Sem Jekyll, sem etapa opaca,
# com log visível em caso de falha.
#
#   workflow_dispatch — no dia do incidente, o push parou de disparar build e
#   foi preciso pedir um pela API para destravar. Com o gatilho manual dá para
#   forçar uma publicação pela interface do Actions, sem precisar de um commit
#   vazio nem de chamada de API.
#
# 2026-08-06, algumas horas depois: cancel-in-progress VOLTOU A SER TRUE.
#
# A escolha original era FALSE, para que os deploys entrassem em fila em vez de
# se derrubarem — no modo legacy, com duas pessoas publicando a cada poucos
# minutos e um build de NOVE MINUTOS, cada push novo cancelava o anterior e
# nenhum chegava ao fim.
#
# Essa premissa morreu junto com o modo legacy. Medido nos runs desta esteira,
# a publicação leva 20 a 30 SEGUNDOS. Duas publicações colidirem nessa janela é
# raro, e quando colidem o resultado certo é justamente o que o cancelamento
# produz: o push mais novo já contém os commits do mais velho, então publicar
# só o último não perde nada. Para um site estático, "o último vence" é a
# semântica correta.
#
# O que FALSE custou, medido: às 18:54 um run ficou preso esperando runner e
# não registrou um único passo. Com a fila sem quem a fure, todos os deploys
# seguintes empilharam atrás dele. Das 18:54 às 22:17 — três horas e meia —
# nada foi publicado, e só destravou quando alguém cancelou os dois runs à mão.
# É o MESMO sintoma que este arquivo foi criado para resolver (site servindo
# versão antiga), pelo mecanismo oposto.
#
# Com TRUE, aquele push das 19:23 teria cancelado o run preso e publicado.
#
# timeout-minutes no job cobre o outro modo de falha, que o cancelamento não
# alcança: um job que JÁ está rodando e trava (o deploy-pages pendurado na API
# do Pages, por exemplo). Sem ele o padrão do GitHub é 360 minutos — seis horas
# de fila travada num job que normalmente dura 25 segundos. Note que
# timeout-minutes NÃO conta tempo esperando runner, que foi exatamente o caso
# das 18:54: por isso ele é complemento do cancel-in-progress, não substituto.

name: Publica no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar: ler o repositório, escrever no Pages e
# pedir o token OIDC que o deploy-pages usa para se autenticar.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    # 10 minutos para um job que leva 25 segundos: folga de 20x para uma rede
    # ruim ou um bundle maior, e ainda assim curto o bastante para que um job
    # pendurado não segure a publicação por horas.
    timeout-minutes: 10

    # 2026-08-08: as quatro actions subiram um major de uma vez.
    #
    # O motivo não foi "estar atualizado": o runner passou a AVISAR em cada
    # publicação que checkout@v4, configure-pages@v5, deploy-pages@v4 e o
    # upload-artifact@v4 de dentro do upload-pages-artifact@v3 pedem Node 20,
    # descontinuado, e que estavam sendo forçados a rodar em Node 24. Enquanto é
    # aviso, publica; quando o GitHub tirar o Node 20 do runner, vira falha — e
    # falha aqui é o site inteiro parado numa versão antiga, que é exatamente o
    # incidente que fez este arquivo existir.
    #
    # Conferido antes de trocar, e não deduzido do número: checkout@v7,
    # configure-pages@v6 e deploy-pages@v5 declaram `using: node24` no próprio
    # action.yml. O upload-pages-artifact@v5 é composite — quem carrega o Node
    # é o upload-artifact que ele chama por dentro, e na v5 esse passou a ser
    # v7.0.0 (na v3 era o v4 que aparecia no aviso).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # path: "." publica a raiz do repositório, que é como o site está
      # organizado — /vestibular-direito/, /vestibular-direito-v2/ e
      # /vestibular-medicina/data/ são servidos lado a lado, e o v2 carrega
      # dados do v1 por caminho relativo (../vestibular-direito/data/).
      # Empacotar só uma das pastas quebraria esse carregamento.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - id: deploy
        uses: actions/deploy-pages@v5
