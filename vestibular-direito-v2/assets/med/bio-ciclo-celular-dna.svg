<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-label="Quantidade de DNA por celula: patamar 2C, subida gradual a 4C, patamar e queda brusca a 2C">
  <style>
    .eixo  { stroke: #475569; stroke-width: 1.6; fill: none; }
    .curva { stroke: #0A2540; stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .c2    { stroke: #1E40AF; stroke-width: 2.6; fill: none; stroke-dasharray: 8 5; stroke-linejoin: round; }
    .c3    { stroke: #0F766E; stroke-width: 2.4; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
    .c4    { stroke: #9A3412; stroke-width: 2.4; fill: none; stroke-dasharray: 12 4 2 4; }
    .guia  { stroke: #94A3B8; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .faixa { stroke: #475569; stroke-width: 1.2; }
    .rot   { fill: #475569; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leg   { fill: #475569; font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pto   { fill: #0A2540; }
    @media (prefers-color-scheme: dark) {
      .eixo  { stroke: #94A3B8; }
      .curva { stroke: #E2E8F0; }
      .c2    { stroke: #60A5FA; }
      .c3    { stroke: #5EEAD4; }
      .c4    { stroke: #FDBA74; }
      .guia  { stroke: #64748B; }
      .faixa { stroke: #CBD5E1; }
      .rot, .leg { fill: #E2E8F0; }
      .pto   { fill: #E2E8F0; }
    }
  </style>
  <path class="eixo" d="M70 30 V260 H590"/>
  <text class="rot" x="70" y="20" text-anchor="start">DNA por celula</text>
  <text class="rot" x="330" y="298" text-anchor="middle">tempo</text>
  <path class="guia" d="M70 210 H590 M70 90 H590"/>
  <text class="rot" x="62" y="215" text-anchor="end">2C</text>
  <text class="rot" x="62" y="95" text-anchor="end">4C</text>
  <path class="curva" d="M70 210 H170 L300 90 H430 L430 210 H590"/>
  <text class="leg" x="120" y="240" text-anchor="middle">G1</text>
  <text class="leg" x="235" y="240" text-anchor="middle">S</text>
  <text class="leg" x="365" y="240" text-anchor="middle">G2 + M</text>
</svg>
