<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="Heredograma de tres geracoes de condicao autossomica dominante, com uma gestacao em curso">
  <style>
    /* Carregado via &lt;img&gt;, o SVG nao herda as variaveis da pagina: ele tem
       o proprio contexto de estilo. Por isso as duas paletas ficam aqui. */
    .traco { stroke: #0A2540; stroke-width: 2; fill: none; }
    .simb  { stroke: #0A2540; stroke-width: 2.5; fill: #ffffff; }
    .afet  { stroke: #0A2540; stroke-width: 2.5; fill: #0A2540; }
    .rot   { fill: #475569; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .id    { fill: #475569; font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .leg   { fill: #475569; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qm    { fill: #0A2540; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #E2E8F0; }
      .simb  { stroke: #E2E8F0; fill: none; }
      .afet  { stroke: #E2E8F0; fill: #E2E8F0; }
      .rot   { fill: #E2E8F0; }
      .id    { fill: #E2E8F0; }
      .leg   { fill: #E2E8F0; }
      .qm    { fill: #E2E8F0; }
    }
  </style>

  <!-- Geracao I: I-1 homem afetado x I-2 mulher nao afetada -->
  <text class="rot" x="16" y="58">I</text>
  <rect class="afet" x="351" y="38" width="28" height="28"/>
  <circle class="simb" cx="475" cy="52" r="14"/>
  <path class="traco" d="M379 52 H461"/>
  <path class="traco" d="M420 52 V98"/>
  <path class="traco" d="M355 98 H485 M355 98 V130 M485 98 V130"/>
  <text class="id" x="365" y="80">I-1</text> <text class="id" x="475" y="80">I-2</text>

  <!-- Geracao II: filhos II-1 (afetada) e II-2; II-1 casou-se com II-3, de fora -->
  <text class="rot" x="16" y="150">II</text>
  <rect class="simb" x="211" y="130" width="28" height="28"/>
  <circle class="afet" cx="355" cy="144" r="14"/>
  <rect class="simb" x="471" y="130" width="28" height="28"/>
  <path class="traco" d="M239 144 H341"/>
  <path class="traco" d="M290 144 V190"/>
  <path class="traco" d="M160 190 H420 M160 190 V222 M290 190 V222 M420 190 V218"/>
  <text class="id" x="225" y="172">II-3</text> <text class="id" x="355" y="172">II-1</text> <text class="id" x="485" y="172">II-2</text>

  <!-- Geracao III: III-1 menina afetada, III-2 menino nao afetado e a terceira gestacao -->
  <text class="rot" x="16" y="242">III</text>
  <circle class="afet" cx="160" cy="236" r="14"/>
  <rect class="simb" x="276" y="222" width="28" height="28"/>
  <path class="simb" d="M420 218 L438 236 L420 254 L402 236 Z"/>
  <text class="qm" x="420" y="241">?</text>
  <text class="id" x="160" y="264">III-1</text> <text class="id" x="290" y="264">III-2</text> <text class="id" x="420" y="264">gestação</text>

  <!-- Legenda -->
  <g transform="translate(0,282)">
    <rect class="simb" x="16" y="0" width="18" height="18"/>
    <circle class="simb" cx="55" cy="9" r="9"/>
    <text class="leg" x="72" y="14">não afetados</text>
    <rect class="afet" x="196" y="0" width="18" height="18"/>
    <circle class="afet" cx="235" cy="9" r="9"/>
    <text class="leg" x="252" y="14">afetados</text>
    <rect class="simb" x="356" y="0" width="18" height="18"/>
    <text class="leg" x="380" y="14">homem</text>
    <circle class="simb" cx="474" cy="9" r="9"/>
    <text class="leg" x="491" y="14">mulher</text>
    <path class="simb" d="M560 0 L569 9 L560 18 L551 9 Z"/>
    <text class="leg" x="578" y="14">gestação</text>
  </g>
</svg>
