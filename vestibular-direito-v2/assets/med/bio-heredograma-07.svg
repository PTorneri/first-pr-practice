<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-label="Heredograma de tres geracoes: pai afetado com as duas filhas afetadas e os dois filhos nao afetados">
  <style>
    /* Carregado via &lt;img&gt;, o SVG nao herda as variaveis da pagina: ele tem
       o proprio contexto de estilo. Por isso as duas paletas ficam aqui. */
    .traco { stroke: #0A2540; stroke-width: 2; fill: none; }
    .simb  { stroke: #0A2540; stroke-width: 2.5; fill: #ffffff; }
    .afet  { stroke: #0A2540; stroke-width: 2.5; fill: #0A2540; }
    .rot   { fill: #475569; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .id    { fill: #475569; font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .leg   { fill: #475569; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #E2E8F0; }
      .simb  { stroke: #E2E8F0; fill: none; }
      .afet  { stroke: #E2E8F0; fill: #E2E8F0; }
      .rot   { fill: #E2E8F0; }
      .id    { fill: #E2E8F0; }
      .leg   { fill: #E2E8F0; }
    }
  </style>

  <!-- Geracao I: I-1 homem afetado x I-2 mulher nao afetada -->
  <text class="rot" x="16" y="58">I</text>
  <rect class="afet" x="311" y="38" width="28" height="28"/>
  <circle class="simb" cx="435" cy="52" r="14"/>
  <path class="traco" d="M339 52 H421"/>
  <path class="traco" d="M380 52 V98"/>
  <path class="traco" d="M200 98 H560 M200 98 V130 M320 98 V130 M440 98 V130 M560 98 V130"/>
  <text class="id" x="325" y="80">I-1</text> <text class="id" x="435" y="80">I-2</text>

  <!-- Geracao II: quatro filhos - II-1 e II-2 mulheres afetadas, II-3 e II-4 homens nao afetados -->
  <text class="rot" x="16" y="150">II</text>
  <circle class="afet" cx="200" cy="144" r="14"/>
  <circle class="afet" cx="320" cy="144" r="14"/>
  <rect class="simb" x="426" y="130" width="28" height="28"/>
  <rect class="simb" x="546" y="130" width="28" height="28"/>
  <text class="id" x="200" y="172">II-1</text> <text class="id" x="320" y="172">II-2</text> <text class="id" x="440" y="172">II-3</text> <text class="id" x="560" y="172">II-4</text>

  <!-- II-1 casou-se com um homem nao afetado, sem identificacao no enunciado -->
  <rect class="simb" x="96" y="130" width="28" height="28"/>
  <path class="traco" d="M124 144 H186"/>
  <path class="traco" d="M155 144 V190"/>
  <path class="traco" d="M100 190 H210 M100 190 V222 M210 190 V222"/>

  <!-- Geracao III: III-1 menino afetado, III-2 menina nao afetada -->
  <text class="rot" x="16" y="242">III</text>
  <rect class="afet" x="86" y="222" width="28" height="28"/>
  <circle class="simb" cx="210" cy="236" r="14"/>
  <text class="id" x="100" y="264">III-1</text> <text class="id" x="210" y="264">III-2</text>

  <!-- Legenda -->
  <g transform="translate(0,282)">
    <rect class="simb" x="16" y="0" width="18" height="18"/>
    <circle class="simb" cx="55" cy="9" r="9"/>
    <text class="leg" x="72" y="14">não afetados</text>
    <rect class="afet" x="196" y="0" width="18" height="18"/>
    <circle class="afet" cx="235" cy="9" r="9"/>
    <text class="leg" x="252" y="14">afetados</text>
    <rect class="simb" x="356" y="0" width="18" height="18"/>
    <text class="leg" x="380" y="14">homem</text>
    <circle class="simb" cx="474" cy="9" r="9"/>
    <text class="leg" x="491" y="14">mulher</text>
  </g>
</svg>
