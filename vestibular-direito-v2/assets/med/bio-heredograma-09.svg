<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 342" width="660" height="342" role="img" aria-label="Heredograma de fenilcetonuria: II-2, irma de um afetado, com II-4, que ja teve um filho afetado em uniao anterior">
  <style>
    /* Carregado via &lt;img&gt;, o SVG nao herda as variaveis da pagina: ele tem
       o proprio contexto de estilo. Por isso as duas paletas ficam aqui. */
    .traco { stroke: #0A2540; stroke-width: 2; fill: none; }
    .simb  { stroke: #0A2540; stroke-width: 2.5; fill: #ffffff; }
    .afet  { stroke: #0A2540; stroke-width: 2.5; fill: #0A2540; }
    .rot   { fill: #475569; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .id    { fill: #475569; font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .leg   { fill: #475569; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .qm    { fill: #0A2540; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #E2E8F0; }
      .simb  { stroke: #E2E8F0; fill: none; }
      .afet  { stroke: #E2E8F0; fill: #E2E8F0; }
      .rot   { fill: #E2E8F0; }
      .id    { fill: #E2E8F0; }
      .leg   { fill: #E2E8F0; }
      .qm    { fill: #E2E8F0; }
    }
  </style>

  <!-- Geracao I: casal nao afetado -->
  <text class="rot" x="16" y="58">I</text>
  <rect class="simb" x="139" y="38" width="28" height="28"/>
  <circle class="simb" cx="263" cy="52" r="14"/>
  <path class="traco" d="M167 52 H249"/>
  <path class="traco" d="M208 52 V98"/>
  <path class="traco" d="M90 98 H326 M90 98 V130 M208 98 V130 M326 98 V130"/>
  <text class="id" x="153" y="80">I-1</text> <text class="id" x="263" y="80">I-2</text>

  <!-- Geracao II: fratria II-3, II-1 (afetado) e II-2; II-2 planeja filhos com II-4 -->
  <text class="rot" x="16" y="150">II</text>
  <rect class="simb" x="76" y="130" width="28" height="28"/>
  <rect class="afet" x="194" y="130" width="28" height="28"/>
  <circle class="simb" cx="326" cy="144" r="14"/>
  <rect class="simb" x="430" y="130" width="28" height="28"/>
  <text class="id" x="90" y="172">II-3</text> <text class="id" x="208" y="172">II-1</text> <text class="id" x="326" y="172">II-2</text> <text class="id" x="444" y="172">II-4</text>
  <path class="traco" d="M340 144 H430"/>
  <path class="traco" d="M385 144 V218"/>

  <!-- Uniao anterior de II-4: parceira de fenotipo nao informado e um filho afetado -->
  <circle class="simb" cx="562" cy="144" r="14"/>
  <text class="qm" x="562" y="149">?</text>
  <path class="traco" d="M458 144 H548"/>
  <path class="traco" d="M503 144 V218"/>

  <!-- Geracao III: o filho planejado por II-2 x II-4 e o filho afetado da uniao anterior -->
  <text class="rot" x="16" y="242">III</text>
  <path class="simb" d="M385 218 L403 236 L385 254 L367 236 Z"/>
  <text class="qm" x="385" y="241">?</text>
  <path class="afet" d="M503 218 L521 236 L503 254 L485 236 Z"/>
  <text class="id" x="385" y="264">planejado</text> <text class="id" x="503" y="264">anterior</text>

  <!-- Legenda -->
  <g transform="translate(0,278)">
    <rect class="simb" x="16" y="0" width="18" height="18"/>
    <circle class="simb" cx="55" cy="9" r="9"/>
    <text class="leg" x="72" y="14">não afetados</text>
    <rect class="afet" x="196" y="0" width="18" height="18"/>
    <circle class="afet" cx="235" cy="9" r="9"/>
    <text class="leg" x="252" y="14">afetados</text>
    <rect class="simb" x="356" y="0" width="18" height="18"/>
    <text class="leg" x="380" y="14">homem</text>
    <circle class="simb" cx="474" cy="9" r="9"/>
    <text class="leg" x="491" y="14">mulher</text>
  </g>
  <g transform="translate(0,308)">
    <circle class="simb" cx="25" cy="9" r="9"/>
    <text class="qm" x="25" y="14">?</text>
    <text class="leg" x="42" y="14">fenótipo não informado</text>
    <path class="simb" d="M240 0 L249 9 L240 18 L231 9 Z"/>
    <text class="leg" x="258" y="14">sexo não informado</text>
  </g>
</svg>
