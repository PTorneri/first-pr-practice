<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336" width="660" height="336" role="img" aria-label="Heredograma em que a mae afetada transmite a condicao a todos os filhos e o pai afetado nao transmite a nenhum">
  <style>
    /* Carregado via &lt;img&gt;, o SVG nao herda as variaveis da pagina: ele tem
       o proprio contexto de estilo. Por isso as duas paletas ficam aqui. */
    .traco { stroke: #0A2540; stroke-width: 2; fill: none; }
    .simb  { stroke: #0A2540; stroke-width: 2.5; fill: #ffffff; }
    .afet  { stroke: #0A2540; stroke-width: 2.5; fill: #0A2540; }
    .rot   { fill: #475569; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .id    { fill: #475569; font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .leg   { fill: #475569; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #E2E8F0; }
      .simb  { stroke: #E2E8F0; fill: none; }
      .afet  { stroke: #E2E8F0; fill: #E2E8F0; }
      .rot   { fill: #E2E8F0; }
      .id    { fill: #E2E8F0; }
      .leg   { fill: #E2E8F0; }
    }
  </style>

  <!-- Geracao I: I-1 mulher afetada x I-2 homem nao afetado -->
  <text class="rot" x="16" y="58">I</text>
  <circle class="afet" cx="202" cy="52" r="14"/>
  <rect class="simb" x="298" y="38" width="28" height="28"/>
  <path class="traco" d="M216 52 H298"/>
  <path class="traco" d="M257 52 V98"/>
  <path class="traco" d="M90 98 H444 M90 98 V130 M208 98 V130 M326 98 V130 M444 98 V130"/>
  <text class="id" x="202" y="80">I-1</text> <text class="id" x="312" y="80">I-2</text>

  <!-- Geracao II: os quatro filhos do casal, de ambos os sexos, todos afetados -->
  <text class="rot" x="16" y="150">II</text>
  <circle class="afet" cx="90" cy="144" r="14"/>
  <circle class="afet" cx="208" cy="144" r="14"/>
  <rect class="afet" x="312" y="130" width="28" height="28"/>
  <rect class="afet" x="430" y="130" width="28" height="28"/>
  <text class="id" x="208" y="172">II-1</text> <text class="id" x="326" y="172">II-2</text> <text class="id" x="444" y="172">II-3</text>

  <!-- II-3, homem afetado, casou-se com II-4, mulher nao afetada -->
  <circle class="simb" cx="562" cy="144" r="14"/>
  <path class="traco" d="M458 144 H548"/>
  <path class="traco" d="M503 144 V190"/>
  <path class="traco" d="M393 190 H613 M393 190 V222 M503 190 V222 M613 190 V222"/>
  <text class="id" x="562" y="172">II-4</text>

  <!-- Geracao III: os tres filhos de II-3 x II-4, de ambos os sexos, nenhum afetado -->
  <text class="rot" x="16" y="242">III</text>
  <rect class="simb" x="379" y="222" width="28" height="28"/>
  <circle class="simb" cx="503" cy="236" r="14"/>
  <rect class="simb" x="599" y="222" width="28" height="28"/>

  <!-- Legenda -->
  <g transform="translate(0,278)">
    <rect class="simb" x="16" y="0" width="18" height="18"/>
    <circle class="simb" cx="55" cy="9" r="9"/>
    <text class="leg" x="72" y="14">não afetados</text>
    <rect class="afet" x="196" y="0" width="18" height="18"/>
    <circle class="afet" cx="235" cy="9" r="9"/>
    <text class="leg" x="252" y="14">afetados</text>
    <rect class="simb" x="356" y="0" width="18" height="18"/>
    <text class="leg" x="380" y="14">homem</text>
    <circle class="simb" cx="474" cy="9" r="9"/>
    <text class="leg" x="491" y="14">mulher</text>
  </g>
  <text class="leg" x="16" y="322">O quarto filho do casal I-1 × I-2, à esquerda, não recebe número no enunciado.</text>
</svg>
