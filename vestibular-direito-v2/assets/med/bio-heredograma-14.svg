<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 244" width="660" height="244" role="img" aria-label="Heredograma de doenca autossomica recessiva: II-1, filha de mae afetada, casada com II-3, irmao de uma mulher afetada">
  <style>
    /* Carregado via &lt;img&gt;, o SVG nao herda as variaveis da pagina: ele tem
       o proprio contexto de estilo. Por isso as duas paletas ficam aqui. */
    .traco { stroke: #0A2540; stroke-width: 2; fill: none; }
    .simb  { stroke: #0A2540; stroke-width: 2.5; fill: #ffffff; }
    .afet  { stroke: #0A2540; stroke-width: 2.5; fill: #0A2540; }
    .rot   { fill: #475569; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .id    { fill: #475569; font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .leg   { fill: #475569; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #E2E8F0; }
      .simb  { stroke: #E2E8F0; fill: none; }
      .afet  { stroke: #E2E8F0; fill: #E2E8F0; }
      .rot   { fill: #E2E8F0; }
      .id    { fill: #E2E8F0; }
      .leg   { fill: #E2E8F0; }
    }
  </style>

  <!-- Geracao I, a esquerda: os pais de II-3, nenhum deles afetado, sem numeracao no enunciado -->
  <text class="rot" x="16" y="58">I</text>
  <rect class="simb" x="90" y="38" width="28" height="28"/>
  <circle class="simb" cx="214" cy="52" r="14"/>
  <path class="traco" d="M118 52 H200"/>
  <path class="traco" d="M159 52 V98"/>
  <path class="traco" d="M100 98 H218 M100 98 V130 M218 98 V130"/>

  <!-- Geracao I, a direita: I-1 homem nao afetado x I-2 mulher afetada -->
  <rect class="simb" x="326" y="38" width="28" height="28"/>
  <circle class="afet" cx="450" cy="52" r="14"/>
  <path class="traco" d="M354 52 H436"/>
  <path class="traco" d="M395 52 V98"/>
  <path class="traco" d="M336 98 H454 M336 98 V130 M454 98 V130"/>
  <text class="id" x="340" y="80">I-1</text> <text class="id" x="450" y="80">I-2</text>

  <!-- Geracao II: a irma afetada de II-3, o proprio II-3, e a fratria II-1 e II-2 -->
  <text class="rot" x="16" y="150">II</text>
  <circle class="afet" cx="100" cy="144" r="14"/>
  <rect class="simb" x="204" y="130" width="28" height="28"/>
  <circle class="simb" cx="336" cy="144" r="14"/>
  <rect class="simb" x="440" y="130" width="28" height="28"/>
  <path class="traco" d="M232 144 H322"/>
  <text class="id" x="218" y="172">II-3</text> <text class="id" x="336" y="172">II-1</text> <text class="id" x="454" y="172">II-2</text>

  <!-- Legenda -->
  <g transform="translate(0,190)">
    <rect class="simb" x="16" y="0" width="18" height="18"/>
    <circle class="simb" cx="55" cy="9" r="9"/>
    <text class="leg" x="72" y="14">não afetados</text>
    <rect class="afet" x="196" y="0" width="18" height="18"/>
    <circle class="afet" cx="235" cy="9" r="9"/>
    <text class="leg" x="252" y="14">afetados</text>
    <rect class="simb" x="356" y="0" width="18" height="18"/>
    <text class="leg" x="380" y="14">homem</text>
    <circle class="simb" cx="474" cy="9" r="9"/>
    <text class="leg" x="491" y="14">mulher</text>
  </g>
  <text class="leg" x="16" y="232">À esquerda, a família de II-3: pais não afetados e uma irmã afetada.</text>
</svg>
