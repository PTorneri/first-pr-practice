<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" role="img" aria-label="Heredograma em que so homens sao afetados e todos eles sao filhos de mulheres nao afetadas">
  <style>
    /* Carregado via &lt;img&gt;, o SVG nao herda as variaveis da pagina: ele tem
       o proprio contexto de estilo. Por isso as duas paletas ficam aqui. */
    .traco { stroke: #0A2540; stroke-width: 2; fill: none; }
    .simb  { stroke: #0A2540; stroke-width: 2.5; fill: #ffffff; }
    .afet  { stroke: #0A2540; stroke-width: 2.5; fill: #0A2540; }
    .rot   { fill: #475569; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .id    { fill: #475569; font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .leg   { fill: #475569; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .traco { stroke: #E2E8F0; }
      .simb  { stroke: #E2E8F0; fill: none; }
      .afet  { stroke: #E2E8F0; fill: #E2E8F0; }
      .rot   { fill: #E2E8F0; }
      .id    { fill: #E2E8F0; }
      .leg   { fill: #E2E8F0; }
    }
  </style>

  <!-- Geracao I: casal nao afetado -->
  <text class="rot" x="16" y="58">I</text>
  <rect class="simb" x="246" y="38" width="28" height="28"/>
  <circle class="simb" cx="370" cy="52" r="14"/>
  <path class="traco" d="M274 52 H356"/>
  <path class="traco" d="M315 52 V98"/>
  <path class="traco" d="M250 98 H380 M250 98 V130 M380 98 V130"/>
  <text class="id" x="260" y="80">I-1</text> <text class="id" x="370" y="80">I-2</text>

  <!-- Geracao II: II-1 homem afetado; a irma II-2, nao afetada, casa-se com II-3 -->
  <text class="rot" x="16" y="150">II</text>
  <rect class="afet" x="236" y="130" width="28" height="28"/>
  <circle class="simb" cx="380" cy="144" r="14"/>
  <rect class="simb" x="496" y="130" width="28" height="28"/>
  <path class="traco" d="M394 144 H496"/>
  <path class="traco" d="M445 144 V190"/>
  <path class="traco" d="M325 190 H565 M325 190 V222 M445 190 V222 M565 190 V222"/>
  <text class="id" x="250" y="172">II-1</text> <text class="id" x="380" y="172">II-2</text> <text class="id" x="510" y="172">II-3</text>

  <!-- Geracao III: dois netos afetados e uma neta nao afetada -->
  <text class="rot" x="16" y="242">III</text>
  <rect class="afet" x="311" y="222" width="28" height="28"/>
  <rect class="afet" x="431" y="222" width="28" height="28"/>
  <circle class="simb" cx="565" cy="236" r="14"/>
  <text class="id" x="325" y="264">III-1</text> <text class="id" x="445" y="264">III-2</text> <text class="id" x="565" y="264">III-3</text>

  <!-- Legenda -->
  <g transform="translate(0,282)">
    <rect class="simb" x="16" y="0" width="18" height="18"/>
    <circle class="simb" cx="55" cy="9" r="9"/>
    <text class="leg" x="72" y="14">não afetados</text>
    <rect class="afet" x="196" y="0" width="18" height="18"/>
    <circle class="afet" cx="235" cy="9" r="9"/>
    <text class="leg" x="252" y="14">afetados</text>
    <rect class="simb" x="356" y="0" width="18" height="18"/>
    <text class="leg" x="380" y="14">homem</text>
    <circle class="simb" cx="474" cy="9" r="9"/>
    <text class="leg" x="491" y="14">mulher</text>
  </g>
</svg>
