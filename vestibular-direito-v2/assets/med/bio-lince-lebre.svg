<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" role="img" aria-label="Populacoes de lebres e de linces oscilando ao longo do tempo, com os picos dos linces defasados em relacao aos das lebres">
