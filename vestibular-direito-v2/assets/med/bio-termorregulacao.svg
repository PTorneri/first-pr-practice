<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" role="img" aria-label="Temperatura corporal de dois animais em 24 horas: o animal I acompanha o ambiente, o animal II fica constante em 37 graus">
  <style>
    .eixo  { stroke: #475569; stroke-width: 1.6; fill: none; }
    .curva { stroke: #0A2540; stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .c2    { stroke: #1E40AF; stroke-width: 2.6; fill: none; stroke-dasharray: 8 5; stroke-linejoin: round; }
    .c3    { stroke: #0F766E; stroke-width: 2.4; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
    .c4    { stroke: #9A3412; stroke-width: 2.4; fill: none; stroke-dasharray: 12 4 2 4; }
    .guia  { stroke: #94A3B8; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .faixa { stroke: #475569; stroke-width: 1.2; }
    .rot   { fill: #475569; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leg   { fill: #475569; font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pto   { fill: #0A2540; }
    @media (prefers-color-scheme: dark) {
      .eixo  { stroke: #94A3B8; }
      .curva { stroke: #E2E8F0; }
      .c2    { stroke: #60A5FA; }
      .c3    { stroke: #5EEAD4; }
      .c4    { stroke: #FDBA74; }
      .guia  { stroke: #64748B; }
      .faixa { stroke: #CBD5E1; }
      .rot, .leg { fill: #E2E8F0; }
      .pto   { fill: #E2E8F0; }
    }
  </style>
  <path class="eixo" d="M70 30 V260 H590"/>
  <text class="rot" x="70" y="20" text-anchor="start">temperatura corporal (C)</text>
  <text class="rot" x="330" y="298" text-anchor="middle">tempo (24 h)</text>
  <text class="rot" x="62" y="92" text-anchor="end">37</text>
  <text class="rot" x="62" y="112" text-anchor="end">34</text>
  <text class="rot" x="62" y="244" text-anchor="end">12</text>
  <path class="guia" d="M70 238 L130 222 L190 172 L250 122 L310 108 L370 132 L430 182 L490 222 L550 236 L590 238"/>
  <path class="curva" d="M70 232 L130 220 L190 180 L250 132 L310 116 L370 138 L430 186 L490 222 L550 232 L590 234"/>
  <path class="c2" d="M70 88 H590"/>
  <path class="guia" d="M92 332 h26"/>
  <text class="leg" x="126" y="332">ambiente</text>
  <path class="curva" d="M212 332 h26"/>
  <text class="leg" x="246" y="332">animal I</text>
  <path class="c2" d="M330 332 h26"/>
  <text class="leg" x="364" y="332">animal II</text>
</svg>
