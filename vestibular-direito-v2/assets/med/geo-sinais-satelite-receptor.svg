<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="Esquema com quatro satelites em orbita emitindo sinais que convergem para a antena de um unico receptor na superficie terrestre, cada sinal rotulado com a distancia que mede">
  <style>
    /* Carregado via &lt;img&gt;, o SVG nao herda as variaveis da pagina: as duas
       paletas ficam aqui, e a media query e avaliada contra o sistema. */
    .terra  { stroke: #475569; stroke-width: 2; fill: none; }
    .corpo  { fill: #0A2540; stroke: none; }
    .painel { stroke: #0A2540; stroke-width: 1.6; fill: none; }
    .haste  { stroke: #0A2540; stroke-width: 1.6; fill: none; }
    .sinal  { stroke: #1E40AF; stroke-width: 1.8; fill: none; stroke-dasharray: 7 5; }
    .rec    { fill: #0A2540; stroke: none; }
    .ant    { stroke: #0A2540; stroke-width: 1.8; fill: none; }
    .lider  { stroke: #94A3B8; stroke-width: 1.1; fill: none; }
    .rot    { fill: #475569; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .leg    { fill: #475569; font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .terra  { stroke: #94A3B8; }
      .corpo  { fill: #E2E8F0; }
      .painel { stroke: #E2E8F0; }
      .haste  { stroke: #E2E8F0; }
      .sinal  { stroke: #60A5FA; }
      .rec    { fill: #E2E8F0; }
      .ant    { stroke: #E2E8F0; }
      .lider  { stroke: #64748B; }
      .rot, .leg { fill: #E2E8F0; }
    }
  </style>

  <!-- Curvatura da superficie terrestre -->
  <path class="terra" d="M40 276.8 A 1160 1160 0 0 1 620 276.8"/>

  <!-- Sinais: de cada satelite ate a antena do receptor -->
  <path class="sinal" d="M110 80 L330 211"/>
  <path class="sinal" d="M250 45 L330 211"/>
  <path class="sinal" d="M430 52 L330 211"/>
  <path class="sinal" d="M570 88 L330 211"/>

  <!-- Distancia que cada sinal mede -->
  <text class="leg" x="211" y="121" text-anchor="middle">d1</text>
  <text class="leg" x="298" y="108" text-anchor="middle">d2</text>
  <text class="leg" x="403" y="128" text-anchor="middle">d3</text>
  <text class="leg" x="478" y="157" text-anchor="middle">d4</text>

  <!-- Constelacao: quatro satelites em orbita -->
  <g transform="translate(110,80)">
    <path class="haste" d="M-19 0 H19"/>
    <rect class="painel" x="-34" y="-7" width="15" height="14"/>
    <rect class="painel" x="19" y="-7" width="15" height="14"/>
    <path class="painel" d="M-26.5 -7 V7 M26.5 -7 V7"/>
    <rect class="corpo" x="-8" y="-7" width="16" height="14" rx="2"/>
  </g>
  <g transform="translate(250,45)">
    <path class="haste" d="M-19 0 H19"/>
    <rect class="painel" x="-34" y="-7" width="15" height="14"/>
    <rect class="painel" x="19" y="-7" width="15" height="14"/>
    <path class="painel" d="M-26.5 -7 V7 M26.5 -7 V7"/>
    <rect class="corpo" x="-8" y="-7" width="16" height="14" rx="2"/>
  </g>
  <g transform="translate(430,52)">
    <path class="haste" d="M-19 0 H19"/>
    <rect class="painel" x="-34" y="-7" width="15" height="14"/>
    <rect class="painel" x="19" y="-7" width="15" height="14"/>
    <path class="painel" d="M-26.5 -7 V7 M26.5 -7 V7"/>
    <rect class="corpo" x="-8" y="-7" width="16" height="14" rx="2"/>
  </g>
  <g transform="translate(570,88)">
    <path class="haste" d="M-19 0 H19"/>
    <rect class="painel" x="-34" y="-7" width="15" height="14"/>
    <rect class="painel" x="19" y="-7" width="15" height="14"/>
    <path class="painel" d="M-26.5 -7 V7 M26.5 -7 V7"/>
    <rect class="corpo" x="-8" y="-7" width="16" height="14" rx="2"/>
  </g>
  <text class="leg" x="110" y="118" text-anchor="middle">satelite</text>

  <!-- Receptor no solo, com a antena onde os quatro sinais se cruzam -->
  <rect class="rec" x="321" y="228" width="18" height="12" rx="2"/>
  <path class="ant" d="M330 228 V214"/>
  <circle class="rec" cx="330" cy="211" r="3.5"/>
  <path class="lider" d="M330 258 V244"/>
  <text class="leg" x="330" y="272" text-anchor="middle">receptor</text>

  <!-- Superficie e legenda -->
  <path class="lider" d="M496 292 L468 247"/>
  <text class="leg" x="628" y="296" text-anchor="end">superficie terrestre</text>
  <path class="sinal" d="M40 304 h26"/>
  <text class="leg" x="74" y="308">sinal do satelite ate o receptor</text>
</svg>
